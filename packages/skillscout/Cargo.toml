[package]
name = "skillscout"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "Auto-detect and install the best AI agent skills for your project"
license = "MIT"
homepage = "https://skillscout.sh"
repository = "https://github.com/GaboTech/SkillScout"
keywords = ["cli", "ai", "skills", "agent"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "skillscout"
path = "src/main.rs"

[lib]
name = "skillscout"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4.5.32", features = ["derive"] }
crossterm = "0.28.1"
indicatif = "0.17.8"
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
dirs = "5.0.1"
walkdir = "2.5.0"
thiserror = "2.0.12"
tokio = { version = "1.43.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.15.0"
assert_cmd = "2.0.17"
httpmock = "0.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
