[package]
name = "skillindex"
version = "3.2.0"
edition = "2024"
default-run = "skillindex"
rust-version = "1.98.1"
description = "Detecta automáticamente tu stack tecnológico e instala las mejores skills de agentes IA para tu proyecto"
license = "MIT"
homepage = "https://skillindex.netlify.app"
repository = "https://github.com/Gabox301/SkillIndex"
keywords = ["cli", "ai", "skills", "agent"]
categories = ["command-line-utilities"]
readme = "README.md"
exclude = ["bin/*", "skills-registry/*", "node_modules/*", "dist/*", ".env", "pnpm-lock.yaml", "bun.lock"]

[[bin]]
name = "skillindex"
path = "src/main.rs"

[[bin]]
name = "validate-registry"
path = "src/bin/validate_registry.rs"

[[bin]]
name = "sync-skills"
path = "src/bin/sync_skills.rs"

[[bin]]
name = "fendo"
path = "src/bin/fendo.rs"

[[bin]]
name = "regenerate-index"
path = "src/bin/regenerate_index.rs"

[lib]
name = "skillindex"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5.32", features = ["derive"] }
crossterm = "0.29.0"
flate2 = "1.1.5"
indicatif = "0.18.6"
regex = "1.12.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
sha2 = "0.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tar = "0.4.44"
tempfile = "3.15.0"
dirs = "7.0.0"
walkdir = "2.5.0"
thiserror = "2.0.12"
tokio = { version = "1.43.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.15.0"
assert_cmd = "2.0.17"
httpmock = "0.8.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
